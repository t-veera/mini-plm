# Dev reverse proxy: single origin on http://localhost (port 80) in front of the
# dev stack — React dev server (frontend:3000, with HMR websockets) and Django
# (backend:8000). Lets browser-saved credentials for http://localhost work.

# Websocket upgrade mapping (http context, so it lives above the server block).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 200M;   # roomy so large file/folder uploads pass

    # Common proxy headers (inherited by backend locations that add no headers
    # of their own). $http_host keeps the port so Django's CSRF origin check passes.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # --- Django backend ---
    location /api/      { proxy_pass http://backend:8000; }
    location /api-auth/ { proxy_pass http://backend:8000; }
    location /admin/    { proxy_pass http://backend:8000; }
    location /media/    { proxy_pass http://backend:8000; }
    # Django's own static (admin + DRF browsable API) — more specific, so these win.
    location /static/admin/          { proxy_pass http://backend:8000; }
    location /static/rest_framework/ { proxy_pass http://backend:8000; }
    # Everything else under /static/ is the React dev-server bundle.
    location /static/ { proxy_pass http://frontend:3000; }

    # --- React dev server (HMR websocket) ---
    location /ws {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
